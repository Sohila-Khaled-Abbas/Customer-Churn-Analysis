<text x="72" y="72" class="kicker">SYSTEM ARCHITECTURE  /  END-TO-END DATA FLOW</text>
<text x="72" y="132" class="title">Telecom Churn Analytics</text>
<text x="72" y="172" class="subtitle">From raw customer records to a PostgreSQL analytics layer and a live Power BI experience.</text>
<text x="72" y="238" class="section">01  SOURCE &amp; EXPLORATION</text><text x="590" y="238" class="section">02  DATA ENGINEERING</text><text x="1140" y="238" class="section">03  BI &amp; DECISION SUPPORT</text><rect x="72" y="270" width="420" height="185" rx="18" fill="url(#teal)" stroke="#2d746e" stroke-width="1.5" filter="url(#shadow)"/><text x="102" y="310" class="tag" fill="#4dd6b4">RAW + CURATED DATA</text><text x="102" y="350" class="mono">raw_data/telecom_customer_churn.csv</text><text x="102" y="379" class="mono">raw_data/telecom_zipcode_population.csv</text><text x="102" y="408" class="mono">cleaned_data/Fact_Customers.csv</text><text x="102" y="437" class="mono">cleaned_data/Dim_Zip_Code.csv</text><rect x="72" y="485" width="420" height="185" rx="18" fill="url(#purple)" stroke="#5c5792" stroke-width="1.5" filter="url(#shadow)"/><text x="102" y="525" class="tag" fill="#b6a0ff">EXPLORATORY ANALYSIS</text><text x="102" y="565" class="body">EDA/churn_analysis.xlsx</text><text x="102" y="594" class="body">EDA/telecom_churn_analysis.ipynb</text><rect x="102" y="621" width="132" height="30" rx="15" fill="#b6a0ff" opacity=".14"/><text x="168.0" y="641" text-anchor="middle" class="tag" fill="#b6a0ff">EXCEL EDA</text><rect x="246" y="621" width="150" height="30" rx="15" fill="#70b8ff" opacity=".14"/><text x="321.0" y="641" text-anchor="middle" class="tag" fill="#70b8ff">PYTHON NOTEBOOK</text><rect x="590" y="270" width="460" height="145" rx="18" fill="url(#blue)" stroke="#416e91" stroke-width="1.5" filter="url(#shadow)"/><text x="622" y="310" class="tag" fill="#70b8ff">01 / POSTGRESQL STAGING</text><text x="622" y="350" class="heading">telecom.stg_customers</text><text x="622" y="382" class="body">Typed source columns · customer-level staging</text><path d="M820 422 L820 460" class="arrow" stroke="#70b8ff" marker-end="url(#arr-blue)"/><rect x="590" y="465" width="460" height="165" rx="18" fill="url(#teal)" stroke="#2d746e" stroke-width="1.5" filter="url(#shadow)"/><text x="622" y="505" class="tag" fill="#4dd6b4">02 / DIMENSIONAL BUILD</text><text x="622" y="546" class="heading">Dimensions + fact snapshot</text><text x="622" y="580" class="body">dim_customer · dim_geo · dim_service</text><text x="622" y="607" class="body">fact_customer_snapshot + churn flags</text><path d="M820 634 L820 674" class="arrow" stroke="#4dd6b4" marker-end="url(#arr-teal)"/><rect x="590" y="680" width="460" height="165" rx="18" fill="url(#gold)" stroke="#806345" stroke-width="1.5" filter="url(#shadow)"/><text x="622" y="720" class="tag" fill="#ffc878">03 / ANALYTICS SERVING</text><text x="622" y="761" class="heading">Business SQL + materialized views</text><text x="622" y="795" class="body">KPI · contract · payment · offer · geo</text><text x="622" y="820" class="body">Retention &amp; service-lever summaries</text><rect x="590" y="850" width="460" height="68" rx="14" fill="#142331" stroke="#3d6071" stroke-width="1.5" filter="url(#shadow)"/><rect x="612" y="869" width="165" height="30" rx="15" fill="#70b8ff" opacity=".14"/><text x="694.5" y="889" text-anchor="middle" class="tag" fill="#70b8ff">GITHUB ACTIONS</text><text x="794" y="890" class="body">SQL deployment via PostgreSQL secrets</text><path d="M1050 885 L1070 885 L1070 390 L1058 390" class="arrow" stroke="#70b8ff" marker-end="url(#arr-blue)" stroke-dasharray="8 7"/><rect x="1140" y="270" width="388" height="185" rx="18" fill="url(#gold)" stroke="#806345" stroke-width="1.5" filter="url(#shadow)"/><text x="1172" y="310" class="tag" fill="#ffc878">POWER BI CONSUMPTION</text><text x="1172" y="352" class="heading">Import-mode reporting</text><text x="1172" y="390" class="body">PostgreSQL fact + materialized views</text><text x="1172" y="418" class="body">DAX measures · themed visual layer</text><path d="M1334 464 L1334 500" class="arrow" stroke="#ffc878" marker-end="url(#arr-gold)"/><rect x="1140" y="510" width="388" height="180" rx="18" fill="url(#teal)" stroke="#2d746e" stroke-width="1.5" filter="url(#shadow)"/><text x="1172" y="550" class="tag" fill="#4dd6b4">LIVE REPORT</text><text x="1172" y="592" class="heading">Telecom Churn Dashboard</text><text x="1172" y="628" class="body">Churn KPIs · drivers · customer segments</text><text x="1172" y="655" class="body">Geography · high-value retention</text><rect x="1140" y="735" width="388" height="128" rx="18" fill="#111e2c" stroke="#3d6071" stroke-width="1.5" filter="url(#shadow)"/><text x="1172" y="775" class="tag" fill="#70b8ff">BUSINESS QUESTIONS</text><text x="1172" y="814" class="body">Who is leaving? What correlates with churn?</text><text x="1172" y="839" class="body">Which segments merit retention attention?</text><path d="M492 362 L578 342" class="arrow" stroke="#4dd6b4" marker-end="url(#arr-teal)"/><path d="M1050 750 L1128 590" class="arrow" stroke="#ffc878" marker-end="url(#arr-gold)"/><line x1="72" y1="940" x2="1528" y2="940" stroke="#294052"/><text x="72" y="972" class="small">Source-aligned with repository SQL, EDA files and dashboard documentation. No unsupported KPI values are asserted.</text><text x="1528" y="972" text-anchor="end" class="small">CUSTOMER CHURN ANALYSIS  ·  POSTGRESQL × POWER BI</text></svg>