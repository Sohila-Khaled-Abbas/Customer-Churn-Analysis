<circle cx="1460" cy="95" r="210" fill="#1f7772" opacity=".08"/>
<circle cx="120" cy="920" r="260" fill="#355b93" opacity=".08"/>
<rect x="0" y="0" width="1600" height="8" fill="url(#top)"/>
<text x="72" y="72" class="kicker">DATA MART  /  REPORTING LAYER</text>
<text x="72" y="132" class="title">PostgreSQL Analytics Layer</text>
<text x="72" y="172" class="subtitle">How the staging table is shaped into a customer snapshot and reusable churn insight outputs.</text>
<rect x="72" y="235" width="360" height="145" rx="18" fill="url(#blue)" stroke="#416e91" stroke-width="1.5" filter="url(#shadow)"/><text x="104" y="277" class="tag" fill="#70b8ff">01 / STAGING</text><text x="104" y="319" class="heading">stg_customers</text><text x="104" y="352" class="body">Raw customer attributes · one source row per customer</text><path d="M450 308 L530 308" class="arrow" stroke="#70b8ff" marker-end="url(#arr-blue)"/><rect x="545" y="220" width="520" height="185" rx="18" fill="url(#teal)" stroke="#2d746e" stroke-width="1.5" filter="url(#shadow)"/><text x="580" y="263" class="tag" fill="#4dd6b4">02 / CORE ANALYTICAL FACT</text><text x="580" y="307" class="heading">fact_customer_snapshot</text><text x="580" y="344" class="body">Customer + ZIP + service / contract descriptors</text><text x="580" y="371" class="body">monthly_charges · total_revenue · tenure</text><text x="580" y="398" class="body">churn_flag · new_last_quarter · high_value</text><path d="M1080 308 L1160 308" class="arrow" stroke="#4dd6b4" marker-end="url(#arr-teal)"/><rect x="72" y="430" width="360" height="250" rx="18" fill="url(#purple)" stroke="#5c5792" stroke-width="1.5" filter="url(#shadow)"/><text x="104" y="472" class="tag" fill="#b6a0ff">REFERENCE DIMENSIONS</text><rect x="96" y="490" width="312" height="48" rx="12" fill="#211f3c" stroke="#5c5792" stroke-width="1.5" filter="url(#shadow)"/><text x="116" y="520" class="body">dim_customer  ·  customer profile</text><rect x="96" y="548" width="312" height="48" rx="12" fill="#211f3c" stroke="#5c5792" stroke-width="1.5" filter="url(#shadow)"/><text x="116" y="578" class="body">dim_geo  ·  ZIP + population</text><rect x="96" y="606" width="312" height="48" rx="12" fill="#211f3c" stroke="#5c5792" stroke-width="1.5" filter="url(#shadow)"/><text x="116" y="636" class="body">dim_service  ·  service attributes</text><text x="104" y="665" class="small">Objects created by 02_star_schema.sql.</text><path d="M432 540 L485 540 L485 395 L540 395" class="arrow" stroke="#70b8ff" marker-end="url(#arr-blue)" stroke-dasharray="7 7"/><rect x="1165" y="220" width="363" height="405" rx="18" fill="url(#gold)" stroke="#806345" stroke-width="1.5" filter="url(#shadow)"/><text x="1197" y="263" class="tag" fill="#ffc878">03 / MATERIALIZED VIEWS</text><text x="1197" y="305" class="mono">mv_kpis</text><text x="1197" y="339" class="mono">mv_churn_by_contract</text><text x="1197" y="373" class="mono">mv_churn_by_internet_type</text><text x="1197" y="407" class="mono">mv_churn_by_payment_method</text><text x="1197" y="441" class="mono">mv_levers_matrix</text><text x="1197" y="475" class="mono">mv_churn_by_offer</text><text x="1197" y="509" class="mono">mv_value_segment</text><text x="1197" y="543" class="mono">mv_retention_targets</text><text x="1197" y="577" class="mono">mv_geo_zip</text><path d="M782 410 L782 470" class="arrow" stroke="#4dd6b4" marker-end="url(#arr-teal)"/><rect x="545" y="480" width="520" height="165" rx="18" fill="url(#blue)" stroke="#416e91" stroke-width="1.5" filter="url(#shadow)"/><text x="580" y="520" class="tag" fill="#70b8ff">04 / DAX MEASURE LAYER</text><text x="580" y="560" class="heading">Six documented measures</text><text x="580" y="585" class="small">Customers · Churned Customers · Churn Rate</text><text x="580" y="609" class="small">New Customers · High-Value Customers</text><text x="580" y="633" class="small">High-Value Churn Rate</text><path d="M805 650 L805 700" class="arrow" stroke="#70b8ff" marker-end="url(#arr-blue)"/><rect x="545" y="710" width="520" height="145" rx="18" fill="url(#teal)" stroke="#2d746e" stroke-width="1.5" filter="url(#shadow)"/><text x="580" y="750" class="tag" fill="#4dd6b4">05 / POWER BI REPORT</text><text x="580" y="792" class="heading">Interactive churn storytelling</text><text x="580" y="826" class="body">Executive KPIs · drivers · retention · onboarding · geo</text><rect x="1165" y="690" width="363" height="165" rx="18" fill="#111e2c" stroke="#3d6071" stroke-width="1.5" filter="url(#shadow)"/><text x="1197" y="730" class="tag" fill="#ffc878">OPERATIONAL OUTPUT</text><text x="1197" y="772" class="body">Retention target list</text><text x="1197" y="800" class="body">ZIP-level churn aggregation</text><text x="1197" y="828" class="body">Segment-level rate comparisons</text><line x1="72" y1="920" x2="1528" y2="920" stroke="#294052"/><text x="72" y="958" class="small">Note: dimension objects are created in SQL; the fact snapshot also carries several segmentation attributes. Follow the SQL scripts for the exact deployed joins.</text><text x="1528" y="958" text-anchor="end" class="small">TELECOM ANALYTICS  ·  SERVING LAYER</text></svg>