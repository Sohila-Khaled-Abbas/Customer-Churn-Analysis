<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111b"/><stop offset="0.55" stop-color="#0c1a27"/><stop offset="1" stop-color="#101c2d"/></linearGradient>
 <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#17364b"/><stop offset="0.55" stop-color="#153e42"/><stop offset="1" stop-color="#2b2c3b"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#164a4b"/><stop offset="1" stop-color="#122d35"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4260"/><stop offset="1" stop-color="#152c43"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d3a25"/><stop offset="1" stop-color="#30271f"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#342e58"/><stop offset="1" stop-color="#24243c"/></linearGradient>
