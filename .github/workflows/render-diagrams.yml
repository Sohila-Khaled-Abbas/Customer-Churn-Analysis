name: Render Architecture Diagram PNGs

on:
  push:
    branches: [ main ]
    paths:
      - 'images/*.svg'
      - '.github/workflows/render-diagrams.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render high-resolution PNG previews
        run: |
          rsvg-convert --format=png --width=800 --height=500 \
            --output=images/telecom_churn_architecture.png \
            images/telecom_churn_architecture.svg
          rsvg-convert --format=png --width=800 --height=500 \
            --output=images/postgres_analytics_layer.png \
            images/postgres_analytics_layer.svg

      - name: Commit generated PNG exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/telecom_churn_architecture.png images/postgres_analytics_layer.png
          if git diff --cached --quiet; then
            echo "PNG exports are already up to date."
            exit 0
          fi
          git commit -m "Render PNG exports from architecture SVGs"
          git push
